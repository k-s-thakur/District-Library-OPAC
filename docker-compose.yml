version: '3.8'

services:
  district-library-opac:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: district-library-opac
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_ADMIN_API_URL=${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:3001}
      - NODE_ENV=production
